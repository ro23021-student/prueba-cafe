name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Pruebas del núcleo
        working-directory: cliente/trazabilidad_core
        run: dart pub get && dart analyze && dart test
      - name: Preparar proyecto Android
        working-directory: cliente/trazabilidad_app
        run: |
          cp -r lib /tmp/lib_bak && cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --project-name trazabilidad_app --platforms=android .
          cp -r /tmp/lib_bak/* lib/ && cp /tmp/pubspec_bak.yaml pubspec.yaml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:allowBackup="false" android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml
      - name: Usar la clave de firma fija (para poder actualizar la app sin desinstalarla)
        run: |
          mkdir -p ~/.android
          cp cliente/trazabilidad_app/ci/debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        working-directory: cliente/trazabilidad_app
        run: flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: trazabilidad-apk
          path: cliente/trazabilidad_app/build/app/outputs/flutter-apk/app-release.apk
