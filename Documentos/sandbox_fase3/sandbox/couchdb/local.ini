[chttpd]
require_valid_user = true
bind_address = 0.0.0.0
[chttpd_auth]
allow_persistent_cookies = false
timeout = 3600
[couchdb]
single_node = true
# Los clientes NO hablan con CouchDB: el backend Rust autentica con JWT (POST /auth/login) y entra a CouchDB
# como administrador del sandbox. Por eso no se activa jwt_auth aqui; el RBAC por rol lo aplica el backend
# (src/domain/sesion.rs) y, para accesos directos de usuarios no admin, validate_doc_update.
# Metricas de CouchDB para Prometheus (puerto sin autenticacion, solo alcanzable dentro de exp-net;
# no se publica al anfitrion). Ruta: /_node/_local/_prometheus
[prometheus]
additional_port = true
bind_address = 0.0.0.0
port = 17986
